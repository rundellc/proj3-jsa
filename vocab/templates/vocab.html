<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html> <head>

<!-- Bootstrap requires the following three meta tags to appear first -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Vocabulary Anagram</title>

<!-- Javascript and Cascading Style Sheets (css) libraries -->
<!-- mostly from content delivery networks                 -->

<!-- jquery; CDN load is usually quick because it's likely cached -->
<script type="text/javascript"
     src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js">
</script>

<!-- Bootstrap stylesheet let's us have a 'responsive' layout; -->
<!-- 12 column grid rearranges itself for smaller screens or windows. -->

<!-- per http://getbootstrap.com/getting-started/  -->
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet"
 href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
 integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7"
  crossorigin="anonymous">

<!-- Latest compiled and minified JavaScript -->
<script
 src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"
 integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS"
 crossorigin="anonymous">
</script>

<!-- Our own css file.  Note how we can link directly here and not -->
<!-- write any routing code in the Flask application. -->
<link rel="stylesheet" href="/static/jumble.css" />

</head>

<body>
<div class="container">

  <div class="row">
    <div class="col-xs-6 text-center">
      <h1>Words</h1>
    </div>
  </div>
<!-- Vocabularly words layed out in 6 columns;
  -- bootstrap may collapse to fewer columns and
  -- more rows if the window is narrow.
  -->
<div class="row">
  {% for word in g.vocab %}
    <div class="col-xs-2 text-center"> {{ word }} </div>
    {% if loop.index is divisibleby 3 %}
    </div> <!-- row -->
    <div class="row">
    {% endif %}
  {% endfor %}
</div> <!-- row -->

<br />

<div class="row">
  <div class="col-xs-6 text-center">
   Use letters from
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center lead">
    <strong>{{ session.jumble }}</strong>
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center">
    to spell {{session.target_count}} words from the list.
  </div> <!-- col -->
</div> <!-- row -->
<br />
<div class="row">
  <div class="col-xs-6 text-center">
    <label for="attempt">Word:</label>
    <input id="attempt" name="attempt" type="text" width="15"
      autocomplete="off"  autofocus />
  </div>
</div></div>

<br />

<h2>You found:</h2>
<ul id="results" style="list-style-type: none; padding-left: 0;">
  {% for match in session.matches %}
    <li>{{ match }}</li>
  {% endfor %}
</ul>

<div class="row">
  <div class="col-xs-6 text-center">
    <p class="message" id="message" style="color: red;"></p>
  </div>
</div>


<!-- This is the Ajax code that sends a GET request to the Flask server whenever the user types in the input box. -->
<!-- This works off updating on the keyup event, so it will send a request every time the user releases a key. -->
<script type="text/javascript">
  $("#attempt").on("keyup", function(event) {
      var typedText = $("#attempt").val();

      // If the box is empty, clear any error messages and stop here BEFORE sending a request to the server. Saves us on unnecessary messages when the user clears the input box.
      if (typedText.trim() === "") {
          $("#message").text("");
          return;
      }

      // Send background GET request to Flask's /_check route
      $.getJSON("/_check", { text: typedText }, function(data) {

          if (data.result.matched) {
              // Successfully found a word: append to results, clear input & errors
              $("#results").append(" " + data.result.word);
              $("#attempt").val("");
              $("#message").text("");
          } else if (data.result.message) {
              // Show error message dynamically
              $("#message").text(data.result.message);
          }

          // Check if win condition is met
          if (data.result.success) {
              window.location.href = "/success";
          }
      });
  });
</script>


</body> </html>
